<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>скачивание видео • the stash</title>
    <meta name="description" content="Пакетное скачивание видео и аудио через VPS бэкенд с поддержкой очереди и выбором качества.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%222%22><path d=%22M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4%22/><polyline points=%227 10 12 15 17 10%22/><line x1=%2212%22 y1=%2215%22 x2=%2212%22 y2=%223%22/></svg>">
    <script>
        (function() {
            const theme = localStorage.getItem('stash_theme') || 'dark';
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        :root {
            --bg-deep: #09090b;
            --bg-surface: #121215;
            --bg-surface-hover: #18181b;
            --bg-card: #141417;
            --bg-input: #0e0e11;
            
            --border-dim: #222226;
            --border-medium: #2e2e34;
            --border-active: #ffffff;
            
            --accent: #ffffff;
            --accent-contrast: #000000;
            --text-main: #f4f4f5;
            --text-muted: #8e8e99;
            --text-dim: #52525b;
            
            --status-waiting: #71717a;
            --status-active: #ffffff;
            --status-success: #ffffff;
            --status-error: #ef4444;
            
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        [data-theme="light"] {
            --bg-deep: #ffffff;
            --bg-surface: #f7f7f8;
            --bg-surface-hover: #eeeeef;
            --bg-card: #fafafa;
            --bg-input: #ffffff;
            
            --border-dim: #e4e4e7;
            --border-medium: #d4d4d8;
            --border-active: #09090b;
            
            --accent: #09090b;
            --accent-contrast: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --text-dim: #a1a1aa;
            
            --status-waiting: #a1a1aa;
            --status-active: #09090b;
            --status-success: #09090b;
            --status-error: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-mono);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.25rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: lowercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-icon {
            background: var(--bg-input);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-icon:hover {
            border-color: var(--border-active);
            color: var(--text-main);
        }

        .hud-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s ease;
            text-decoration: none;
            text-transform: lowercase;
        }

        .hud-btn:hover {
            border-color: var(--border-active);
            color: var(--text-main);
        }

        /* Hero / Summary */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            color: var(--text-main);
        }

        /* Card Container */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Multiline URL Input */
        .textarea-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .urls-textarea {
            width: 100%;
            height: 120px;
            background: var(--bg-input);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            color: var(--text-main);
            font-size: 0.82rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .urls-textarea:focus {
            border-color: var(--border-active);
        }

        .urls-textarea::placeholder {
            color: var(--text-dim);
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.85rem;
        }

        .format-select-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .format-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: lowercase;
        }

        .format-select {
            background: var(--bg-input);
            border: 1px solid var(--border-medium);
            color: var(--text-main);
            padding: 0.45rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .format-select:focus {
            border-color: var(--border-active);
        }

        .action-buttons-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-action-primary {
            background: var(--accent);
            color: var(--accent-contrast);
            border: 1px solid var(--accent);
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: lowercase;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action-primary:hover {
            opacity: 0.9;
        }

        .btn-action-secondary {
            background: var(--bg-input);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: lowercase;
        }

        .btn-action-secondary:hover {
            border-color: var(--border-active);
            color: var(--text-main);
        }

        /* Queue Section */
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-dim);
        }

        .queue-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .queue-stat-item span {
            color: var(--text-main);
            font-weight: 700;
        }

        .queue-actions {
            display: flex;
            gap: 0.5rem;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            min-height: 60px;
        }

        .queue-empty-placeholder {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-dim);
            font-size: 0.82rem;
            text-transform: lowercase;
        }

        .queue-item {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-sm);
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            transition: border-color 0.2s ease;
        }

        .queue-item.active {
            border-color: var(--border-active);
        }

        .queue-item-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .queue-item-meta {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
            min-width: 0;
        }

        .queue-item-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .queue-item-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge-format {
            background: var(--bg-input);
            border: 1px solid var(--border-medium);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.65rem;
            color: var(--text-main);
        }

        .queue-item-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-item-action {
            background: transparent;
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-item-action:hover {
            border-color: var(--border-active);
            color: var(--text-main);
        }

        /* Progress Bar */
        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: var(--bg-input);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.2s ease;
        }

        .queue-item-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .queue-item-status {
            font-weight: 600;
            text-transform: lowercase;
        }

        .queue-item-status.status-completed {
            color: var(--status-success);
        }

        .queue-item-status.status-error {
            color: var(--status-error);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: lowercase;
            color: var(--text-main);
        }

        .setting-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .setting-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: lowercase;
        }

        .setting-input {
            background: var(--bg-input);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.75rem;
            color: var(--text-main);
            font-size: 0.82rem;
            outline: none;
        }

        .setting-input:focus {
            border-color: var(--border-active);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <a href="../../index.html" class="header-brand" title="на главную">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span class="header-title">скачивание видео</span>
            </a>

            <div class="header-actions">
                <button class="btn-icon theme-toggle-btn" id="btn-theme-toggle" title="переключить тему">
                    <!-- SVG populated by script -->
                </button>
                <button class="hud-btn" id="btn-settings" title="настройки">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>настройки</span>
                </button>
            </div>
        </header>

        <!-- Input Card -->
        <section class="card">
            <div class="section-header">
                <h2 class="section-title">добавить ссылки</h2>
                <button class="btn-action-secondary" id="btn-paste-clipboard" style="padding: 0.35rem 0.65rem; font-size: 0.72rem;">вставить из буфера</button>
            </div>

            <div class="textarea-wrapper">
                <textarea 
                    id="urls-input" 
                    class="urls-textarea" 
                    placeholder="https://youtube.com/watch?v=...&#10;https://tiktok.com/@...&#10;https://vk.com/video...&#10;(вставьте одну или несколько ссылок, по одной на строку)"
                ></textarea>
            </div>

            <div class="controls-row">
                <div class="format-select-group">
                    <label for="format-select" class="format-label">формат:</label>
                    <select id="format-select" class="format-select">
                        <option value="best">макс mp4</option>
                        <option value="1080">1080p mp4</option>
                        <option value="720">720p mp4</option>
                        <option value="480">480p mp4</option>
                        <option value="mp3">mp3</option>
                    </select>
                </div>

                <div class="action-buttons-group">
                    <button class="btn-action-secondary" id="btn-clear-input">очистить</button>
                    <button class="btn-action-primary" id="btn-add-queue">добавить в очередь</button>
                </div>
            </div>
        </section>

        <!-- Queue Card -->
        <section class="card">
            <div class="queue-header">
                <h2 class="section-title">очередь загрузки</h2>

                <div class="queue-stats">
                    <div class="queue-stat-item">всего: <span id="stat-total">0</span></div>
                    <div class="queue-stat-item">в очереди: <span id="stat-pending">0</span></div>
                    <div class="queue-stat-item">загружено: <span id="stat-completed">0</span></div>
                </div>

                <div class="queue-actions">
                    <button class="btn-action-secondary" id="btn-clear-all" style="font-size: 0.72rem;">очистить всю очередь</button>
                    <button class="btn-action-secondary" id="btn-clear-completed" style="font-size: 0.72rem;">очистить завершённые</button>
                    <button class="btn-action-primary" id="btn-start-queue" style="font-size: 0.72rem;">запустить очередь</button>
                </div>
            </div>

            <div class="queue-list" id="queue-list">
                <div class="queue-empty-placeholder" id="queue-empty">очередь пуста. добавьте ссылки выше для начала загрузки.</div>
            </div>
        </section>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <h3 class="modal-title">настройки</h3>

            <div class="setting-field">
                <label class="setting-label">статус vps сервера:</label>
                <div id="server-status-indicator" style="font-size: 0.75rem; color: var(--text-muted);">проверка связи...</div>
            </div>

            <div class="setting-field">
                <label class="setting-label">тема оформления:</label>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn-action-secondary" id="btn-theme-dark" style="flex: 1;">тёмная</button>
                    <button type="button" class="btn-action-secondary" id="btn-theme-light" style="flex: 1;">светлая</button>
                </div>
            </div>

            <div class="controls-row" style="margin-top: 0.5rem;">
                <button class="btn-action-secondary" id="btn-test-server">проверить связь</button>
                <button class="btn-action-primary" id="btn-save-settings">закрыть</button>
            </div>
        </div>
    </div>

    <script src="sound.js"></script>
    <script src="app.js"></script>
</body>
</html>
