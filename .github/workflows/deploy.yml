name: Deploy The Stash

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-vps:
    name: Deploy to VPS (SFTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: Sync Static Assets to VPS
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || '150.241.64.119' }}
          SFTP_USER: ${{ secrets.SFTP_USER || 'aser' }}
          SFTP_PASS: ${{ secrets.SFTP_PASS || 'Jp9GmDHP3n2WSRrU' }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR || '/stash' }}
        run: |
          python .github/scripts/deploy_sftp.py

  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
