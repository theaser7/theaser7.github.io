<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Flexle &bull; Word Guessing Game</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --card-border: #2e3446;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --tile-bg: #141721;
            --tile-border: #2e3446;
            --tile-active: #6366f1;
            --color-correct: #22c55e;
            --color-present: #eab308;
            --color-absent: #374151;
            --key-bg: #262b3d;
            --key-hover: #333a52;
            --key-text: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1117;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #preloader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-grid {
            display: grid;
            grid-template-columns: repeat(2, 40px);
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .loader-tile {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            animation: pulseTile 1.2s infinite ease-in-out;
        }

        .loader-tile:nth-child(1) { background: #22c55e; animation-delay: 0s; }
        .loader-tile:nth-child(2) { background: #eab308; animation-delay: 0.2s; }
        .loader-tile:nth-child(3) { background: #374151; color: #9ca3af; animation-delay: 0.4s; }
        .loader-tile:nth-child(4) { background: #6366f1; animation-delay: 0.6s; }

        @keyframes pulseTile {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 15px currentColor; }
        }

        .loader-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        .header {
            width: 100%;
            max-width: 650px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            z-index: 1;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(10px);
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-icon:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .btn-icon:disabled, .btn-icon.locked {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-bar {
            width: 100%;
            max-width: 650px;
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            z-index: 1;
        }

        .length-selector {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .len-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.3rem 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .len-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .len-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .len-btn:disabled, .len-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .status-pill {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        .toast {
            background: #ffffff;
            color: #0f1117;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            animation: fadeInOut 2.2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-8px); }
            15% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-8px); }
        }

        /* Board */
        .board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            width: 100%;
            max-width: 650px;
            z-index: 1;
        }

        .board {
            display: grid;
            gap: 6px;
            justify-content: center;
            align-content: center;
        }

        .tile {
            width: clamp(32px, 8vw, 54px);
            height: clamp(32px, 8vw, 54px);
            border: 2px solid var(--tile-border);
            border-radius: 8px;
            background: var(--tile-bg);
            color: var(--text-primary);
            font-size: clamp(1.1rem, 4vw, 1.7rem);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            user-select: none;
            transition: border-color 0.15s ease;
        }

        .tile[data-state="active"] {
            border-color: var(--tile-active);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            animation: pop 0.1s ease-in-out;
        }

        .tile[data-state="correct"] {
            background-color: var(--color-correct) !important;
            border-color: var(--color-correct) !important;
            color: #ffffff;
        }

        .tile[data-state="present"] {
            background-color: var(--color-present) !important;
            border-color: var(--color-present) !important;
            color: #ffffff;
        }

        .tile[data-state="absent"] {
            background-color: var(--color-absent) !important;
            border-color: var(--color-absent) !important;
            color: #9ca3af;
        }

        @keyframes pop {
            50% { transform: scale(1.12); }
        }

        .tile.flip {
            animation: flipTile 0.5s ease forwards;
        }

        @keyframes flipTile {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        .row.shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .row.bounce .tile {
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 20% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            50% { transform: translateY(0); }
            60% { transform: translateY(-8px); }
            80%, 100% { transform: translateY(0); }
        }

        /* Keyboard */
        .keyboard {
            width: 100%;
            max-width: 650px;
            padding: 0.5rem 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
        }

        .key {
            background-color: var(--key-bg);
            color: var(--key-text);
            border: none;
            border-radius: 6px;
            height: 48px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
            transition: background-color 0.15s ease, transform 0.05s ease;
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.wide {
            flex: 1.5;
            font-size: 0.75rem;
        }

        .key[data-state="correct"] {
            background-color: var(--color-correct);
            color: #fff;
        }

        .key[data-state="present"] {
            background-color: var(--color-present);
            color: #fff;
        }

        .key[data-state="absent"] {
            background-color: var(--color-absent);
            color: #6b7280;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 1.75rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .setting-label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .setting-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: .2s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .result-word {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            margin: 0.5rem 0;
        }

        .result-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-grid">
            <div class="loader-tile">F</div>
            <div class="loader-tile">L</div>
            <div class="loader-tile">E</div>
            <div class="loader-tile">X</div>
        </div>
        <div class="loader-title">FLEXLE</div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div class="toast-container" id="toast-container"></div>

    <header class="header">
        <div class="header-title-group">
            <a href="../../" class="btn-icon" title="Back to Hub">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <h1>Flexle</h1>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn-icon" id="btn-sound" title="Toggle Sound">
                <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="icon-sound-off" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>
            <button class="btn-icon" id="btn-lang" title="Switch Language">RU</button>
            <button class="btn-icon" id="btn-restart" title="New Game">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
            <button class="btn-icon" id="btn-settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="controls-bar">
        <div class="length-selector" id="length-selector">
            <button class="len-btn" data-len="4">4</button>
            <button class="len-btn active" data-len="5">5</button>
            <button class="len-btn" data-len="6">6</button>
            <button class="len-btn" data-len="7">7</button>
            <button class="len-btn" data-len="8">8</button>
            <button class="len-btn" data-len="9">9</button>
            <button class="len-btn" data-len="10">10</button>
            <button class="len-btn" data-len="random">RND</button>
        </div>
        <div class="status-pill" id="attempts-pill">6 attempts</div>
    </div>

    <main class="board-container">
        <div class="board" id="board"></div>
    </main>

    <div class="keyboard" id="keyboard"></div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="modal-close" id="close-settings">&times;</button>
            </div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Sound Effects</div>
                    <div class="setting-sub">Procedural audio effects</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-sound" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Strict Mode</div>
                    <div class="setting-sub">Only allow valid dictionary words</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-strict">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Language</div>
                    <div class="setting-sub" id="modal-lang-sub">Switch game vocabulary (RU / EN)</div>
                </div>
                <button class="len-btn" id="modal-lang-toggle" style="padding: 0.4rem 0.8rem;">RU</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="modal-gameover">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="gameover-title">Game Over</h2>
                <button class="modal-close" id="close-gameover">&times;</button>
            </div>
            <div class="result-desc" id="gameover-desc">The secret word was:</div>
            <div class="result-word" id="gameover-word">WORD</div>
            <button class="btn-primary" id="btn-play-again">Play Again</button>
        </div>
    </div>

    <script src="sound.js"></script>
    <script src="words.js"></script>
    <script src="game.js"></script>
</body>
</html>
